<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncPulse - Strategic Delegation Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="Styles.css">
</head>

<body>
  <!-- Office Environment Elements -->
  <div class="office-ceiling"></div>
  <div class="office-floor"></div>
  <div class="desk-area"></div>
  <div class="office-window" id="officeWindow">
    <!-- Sun/Moon outside window -->
    <div class="window-sky">
      <div class="sun-moon sun" id="sun"></div>
      <div class="sun-moon moon" id="moon"></div>
    </div>
  </div>
  <!-- Wall Clock -->
  <div class="wall-clock" id="wallClock">
    <div class="clock-hour"></div>
    <div class="clock-minute"></div>
  </div>
  <div class="coffee-mug"></div>
  <div class="office-plant"></div>

  <!-- Theme Toggle -->
  <button id="themeToggle" class="theme-toggle">
    <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
    <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
  </button>

  <!-- Step Back Button - Should be SEPARATE from theme toggle -->
  <button class="step-back-btn" id="stepBackBtn">
    View Desktop
  </button>

  <div class="content-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo">Do<span>Gether</span></div>
        <div class="header-actions">
          <nav class="header-nav">
            <a href="#" class="nav-link">Board</a>
            <a href="#" class="nav-link">Team Activity</a>
            <a href="#" class="nav-link">Insights</a>
          </nav>
          <button id="teamToggle" class="team-toggle-btn">
            Team View
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="board-container">
        <div class="board-quadrant">
          <div class="quadrant-header">🔴 Critical & Urgent</div>
          <div id="urgentImportant" class="task-list"></div>
        </div>

        <div class="board-quadrant">
          <div class="quadrant-header">📅 Strategic Planning</div>
          <div id="schedule" class="task-list"></div>
        </div>

        <div class="board-quadrant">
          <div class="quadrant-header">🤝 Team Delegation</div>
          <div id="delegate" class="task-list"></div>
        </div>

        <div class="board-quadrant">
          <div class="quadrant-header">⚪ Secondary / Backlog</div>
          <div id="eliminate" class="task-list"></div>
        </div>
      </div>
    </main>

    <!-- Team Sidebar -->
    <aside id="teamSidebar" class="team-sidebar glass-strong">
      <h3 class="sidebar-title">Active Team</h3>
      <div id="teamList" class="team-list-container"></div>
    </aside>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav glass">
      <div class="nav-item active">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <span class="nav-label">Analytics</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span class="nav-label">Team</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="nav-label">Settings</span>
      </div>
    </nav>

    <!-- FAB -->
    <button id="addTaskBtn" class="fab">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    </button>

    <!-- Add Task Modal -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal glass-strong">
        <h2 class="modal-title">Create New Task</h2>

        <form id="taskForm" class="task-form">
          <div class="form-group">
            <label class="form-label">Task Name</label>
            <input type="text" id="taskName" class="form-input" placeholder="Enter task description..." required>
          </div>

          <div class="form-group">
            <label class="form-label">Priority Level</label>
            <select id="taskPriority" class="form-select" required>
              <option value="">Select priority...</option>
              <option value="urgent">🔥 Urgent & Important</option>
              <option value="schedule">📆 Schedule</option>
              <option value="delegate">🤝 Delegate</option>
              <option value="eliminate">🗑️ Eliminate</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Assign To</label>
            <select id="taskAssignee" class="form-select" required>
              <option value="">Select team member...</option>
              <option value="me">👤 Me</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Deadline (Optional)</label>
            <input type="datetime-local" id="taskDeadline" class="form-input">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              Create Task
            </button>
            <button type="button" id="cancelBtn" class="btn btn-secondary">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="notificationToast" class="notification-toast glass-strong">
      <div class="notification-header">
        <div class="notification-title">🔔 New Task Assigned</div>
        <button class="notification-close" id="closeNotification">✕</button>
      </div>
      <div class="notification-body" id="notificationBody">
        You have been assigned a new task.
      </div>
      <div class="notification-actions">
        <button class="notification-btn notification-btn-primary" id="viewTask">View Task</button>
        <button class="notification-btn notification-btn-secondary" id="dismissNotification">Later</button>
      </div>
    </div>
  </div>

  <script src="App.js"></script>
</body>

</html>
